name: Release Build

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry Run (uncheck to create a release)'
        required: false
        default: true
        type: boolean
      release_production:
        description: 'Release to latest (production) channel. For stable production releases only!'
        required: false
        default: false
        type: boolean

jobs:
  release-prod-approval:
    name: Approve production release
    if: inputs.release_production == true && inputs.dry_run != true
    runs-on: ubuntu-latest
    environment: release-prod
    permissions:
      contents: read
    steps:
      - name: Verify production release target
        env:
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          if [[ "$REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo "::error::Production releases must run from ${DEFAULT_BRANCH}, not ${REF_NAME}."
            exit 1
          fi

  build:
    name: Build for ${{ matrix.target }}
    needs: release-prod-approval
    if: >-
      !cancelled() &&
      (inputs.release_production != true ||
      inputs.dry_run == true ||
      needs.release-prod-approval.result == 'success')
    runs-on: ${{ matrix.os }}
    environment: release
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            artifact_name: git-ai-linux-x64
            use_docker: true
            docker_image: ubuntu:22.04@sha256:4f838adc7181d9039ac795a7d0aba05a9bd9ecd480d294483169c5def983b64d
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: git-ai-windows-x64
            use_docker: false

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get version from Cargo.toml
        id: get-version
        shell: bash
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | cut -d'"' -f2)
          echo "version=v$VERSION" >> $GITHUB_OUTPUT

      - name: Build in Docker (Linux)
        if: matrix.use_docker == true
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e DEBIAN_FRONTEND=noninteractive \
            -e SENTRY_OSS="${{ secrets.SENTRY_OSS }}" \
            -e POSTHOG_API_KEY="${{ secrets.POSTHOG_API_KEY }}" \
            -e OSS_BUILD="1" \
            ${{ matrix.docker_image }} \
            bash -c "
              apt-get update && \
              apt-get install -y curl build-essential pkg-config musl-tools && \
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.93.0 --target ${{ matrix.target }} && \
              . \$HOME/.cargo/env && \
              cargo build --release --target ${{ matrix.target }} && \
              strip target/${{ matrix.target }}/release/git-ai
            "

      - name: Install Rust toolchain (non-Docker)
        if: matrix.use_docker == false
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.93.0"
          targets: ${{ matrix.target }}

      - name: Cache dependencies (non-Docker)
        if: matrix.use_docker == false
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-

      - name: Build release binary (non-Docker)
        if: matrix.use_docker == false
        run: |
          cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_INCREMENTAL: 0
          SENTRY_OSS: ${{ secrets.SENTRY_OSS }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          OSS_BUILD: "1"

      - name: Verify binary architecture (Linux)
        if: contains(matrix.os, 'ubuntu')
        run: |
          file target/${{ matrix.target }}/release/git-ai
          # Verify the binary is statically linked (musl)
          if ldd target/${{ matrix.target }}/release/git-ai 2>&1 | grep -q 'not a dynamic executable\|statically linked'; then
            echo "Binary is statically linked (musl) - no GLIBC dependency"
          else
            echo "::error::Binary is dynamically linked - expected static musl binary"
            ldd target/${{ matrix.target }}/release/git-ai || true
            exit 1
          fi

      - name: Verify binary architecture (Windows)
        if: contains(matrix.os, 'windows')
        shell: bash
        run: |
          file target/${{ matrix.target }}/release/git-ai.exe

      - name: Strip binary (Windows x64)
        if: matrix.os == 'windows-latest'
        run: |
          strip target/${{ matrix.target }}/release/git-ai.exe

      - name: Create release directory
        run: |
          mkdir -p release

      - name: Copy binary to release directory
        if: contains(matrix.os, 'windows')
        run: |
          cp target/${{ matrix.target }}/release/git-ai.exe release/${{ matrix.artifact_name }}.exe

      - name: Copy binary to release directory (non-Windows)
        if: ${{ !contains(matrix.os, 'windows') }}
        run: |
          cp target/${{ matrix.target }}/release/git-ai release/${{ matrix.artifact_name }}

      - name: Upload artifact (Windows)
        if: contains(matrix.os, 'windows')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_name }}
          path: release/${{ matrix.artifact_name }}.exe
          retention-days: 30

      - name: Upload artifact (non-Windows)
        if: ${{ !contains(matrix.os, 'windows') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_name }}
          path: release/${{ matrix.artifact_name }}
          retention-days: 30

  package-msi:
    name: Build Windows MSI installers
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: windows-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Windows x64 binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: git-ai-windows-x64
          path: artifacts

      - name: Build MSI installers
        shell: pwsh
        run: |
          $version = "${{ needs.build.outputs.version }}".TrimStart('v')
          New-Item -ItemType Directory -Force -Path release | Out-Null
          .\packaging\windows\build-msi.ps1 -BinaryPath "artifacts\git-ai-windows-x64.exe" -Architecture x64 -Version $version -OutputPath "release\git-ai-windows-x64.msi"

      - name: Upload MSI artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: git-ai-windows-msi
          path: release/*.msi
          retention-days: 30

  test-msi:
    name: Test Windows MSI installer
    needs: package-msi
    if: ${{ !cancelled() && needs.package-msi.result == 'success' }}
    runs-on: windows-latest
    steps:
      - name: Download MSI artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: git-ai-windows-msi
          path: release

      - name: Install and uninstall per-user MSI
        shell: pwsh
        run: |
          $msi = (Get-ChildItem release\git-ai-windows-x64.msi).FullName
          $apiBase = 'https://dev.usegitai.com'
          $apiKey = 'ci-package-test-key'
          $gitAi = Join-Path $env:USERPROFILE '.git-ai\bin\git-ai.exe'
          $configPath = Join-Path $env:USERPROFILE '.git-ai\config.json'

          $install = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /norestart API_BASE=$apiBase API_KEY=$apiKey INSTALL_WSL=0" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "MSI install failed with exit code $($install.ExitCode)" }

          $config = Get-Content $configPath -Raw | ConvertFrom-Json
          if ($config.api_base_url -ne $apiBase) { throw 'MSI did not persist API_BASE for the installing user' }
          if ([string]::IsNullOrWhiteSpace($config.api_key)) { throw 'MSI did not persist API_KEY for the installing user' }
          if ((Get-Acl $gitAi).Owner -eq 'NT AUTHORITY\SYSTEM') { throw 'MSI binary is owned by SYSTEM' }
          if ((Get-Acl $configPath).Owner -eq 'NT AUTHORITY\SYSTEM') { throw 'MSI config is owned by SYSTEM' }
          if (Test-Path (Join-Path $env:LOCALAPPDATA 'Git AI')) { throw 'MSI created the retired LocalAppData runtime' }
          if (Test-Path (Join-Path $env:ProgramFiles 'Git AI')) { throw 'MSI created a system-wide runtime' }

          $binaryVersion = (& $gitAi --version).Trim()
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $database = $installer.GetType().InvokeMember(
            'OpenDatabase', 'InvokeMethod', $null, $installer, @($msi, 0)
          )
          $query = "SELECT ``Value`` FROM ``Property`` WHERE ``Property`` = 'ProductCode'"
          $view = $database.GetType().InvokeMember(
            'OpenView', 'InvokeMethod', $null, $database, @($query)
          )
          $view.GetType().InvokeMember('Execute', 'InvokeMethod', $null, $view, $null)
          $record = $view.GetType().InvokeMember('Fetch', 'InvokeMethod', $null, $view, $null)
          $productCode = $record.GetType().InvokeMember(
            'StringData', 'GetProperty', $null, $record, 1
          )
          $wslQuery = "SELECT ``Value`` FROM ``Property`` WHERE ``Property`` = 'INSTALL_WSL'"
          $wslView = $database.GetType().InvokeMember(
            'OpenView', 'InvokeMethod', $null, $database, @($wslQuery)
          )
          $wslView.GetType().InvokeMember('Execute', 'InvokeMethod', $null, $wslView, $null)
          $wslRecord = $wslView.GetType().InvokeMember('Fetch', 'InvokeMethod', $null, $wslView, $null)
          $wslDefault = $wslRecord.GetType().InvokeMember(
            'StringData', 'GetProperty', $null, $wslRecord, 1
          )
          if ($wslDefault -ne '1') { throw "MSI INSTALL_WSL default is '$wslDefault', expected '1'" }
          $registeredVersion = $installer.GetType().InvokeMember(
            'ProductInfo', 'GetProperty', $null, $installer, @($productCode, 'VersionString')
          )
          if ($registeredVersion -ne $binaryVersion) {
            throw "MSI version '$registeredVersion' does not match binary version '$binaryVersion'"
          }

          $uninstall = Start-Process msiexec.exe -ArgumentList "/x `"$msi`" /qn /norestart" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "MSI uninstall failed with exit code $($uninstall.ExitCode)" }

  create-release:
    name: Create Release
    needs: [build, package-msi, test-msi, release-prod-approval]
    runs-on: ubuntu-latest
    if: >-
      !cancelled() &&
      inputs.dry_run != true &&
      needs.build.result == 'success' &&
      needs.package-msi.result == 'success' &&
      needs.test-msi.result == 'success' &&
      (inputs.release_production != true ||
      needs.release-prod-approval.result == 'success')
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Determine release metadata
        id: release-meta
        shell: bash
        env:
          BASE_VERSION: ${{ needs.build.outputs.version }}
          IS_PRODUCTION: ${{ inputs.release_production }}
        run: |
          set -euo pipefail
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          if [[ "$IS_PRODUCTION" == 'true' ]]; then
            RELEASE_TAG="$BASE_VERSION"
            CHANNEL="latest"
            PRERELEASE="false"
            MAKE_LATEST="true"
          else
            RELEASE_TAG="${BASE_VERSION}-next-${SHORT_SHA}"
            CHANNEL="next"
            PRERELEASE="true"
            MAKE_LATEST="false"
          fi

          echo "tag_name=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "release_name=Release $RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "make_latest=$MAKE_LATEST" >> "$GITHUB_OUTPUT"
          echo "channel_label=$CHANNEL" >> "$GITHUB_OUTPUT"

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: git-ai-*
          path: artifacts
          merge-multiple: true

      - name: Create release directory
        run: mkdir -p release

      - name: Move artifacts to release directory
        run: |
          find artifacts -type f -name "git-ai-*" -exec cp {} release/ \;

      - name: List available artifacts
        run: |
          echo "Available artifacts:"
          ls -la release/ || echo "No artifacts found"

      - name: Create checksums
        run: |
          cd release
          shopt -s nullglob
          artifacts=(git-ai-*)
          if [ ${#artifacts[@]} -gt 0 ]; then
            sha256sum "${artifacts[@]}" | sort > SHA256SUMS
          else
            echo "No binaries found to create checksums for"
            touch SHA256SUMS
          fi

      - name: Checkout code for install script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: repo

      - name: Generate version-pinned install script
        run: |
          VERSION="${{ steps.release-meta.outputs.tag_name }}"
          REPO="${{ github.repository }}"
          # Convert checksums to pipe-separated format for embedding
          CHECKSUMS=$(tr '\n' '|' < release/SHA256SUMS | sed 's/|$//')
          if [ -z "$CHECKSUMS" ]; then
            CHECKSUMS="__CHECKSUMS_PLACEHOLDER__"
          fi
          # Replace placeholder values with release-specific values (pattern-based to be resilient to line changes)
          awk -v repo="$REPO" -v version="$VERSION" -v checksums="$CHECKSUMS" '
            /^REPO="__REPO_PLACEHOLDER__"/ { sub(/__REPO_PLACEHOLDER__/, repo) }
            /^PINNED_VERSION="__VERSION_PLACEHOLDER__"/ { sub(/__VERSION_PLACEHOLDER__/, version) }
            /^EMBEDDED_CHECKSUMS="__CHECKSUMS_PLACEHOLDER__"/ { sub(/__CHECKSUMS_PLACEHOLDER__/, checksums) }
            { print }
          ' repo/install.sh > release/install.sh
          chmod +x release/install.sh
          echo "Generated version-pinned install.sh for $VERSION from $REPO"
          echo "Embedded checksums: $CHECKSUMS"

      - name: Generate version-pinned install.ps1 script
        run: |
          VERSION="${{ steps.release-meta.outputs.tag_name }}"
          REPO="${{ github.repository }}"
          # Reuse checksums from earlier step
          CHECKSUMS=$(tr '\n' '|' < release/SHA256SUMS | sed 's/|$//')
          if [ -z "$CHECKSUMS" ]; then
            CHECKSUMS="__CHECKSUMS_PLACEHOLDER__"
          fi
          # Replace placeholder values with release-specific values (pattern-based to be resilient to line changes)
          awk -v repo="$REPO" -v version="$VERSION" -v checksums="$CHECKSUMS" '
            /^[$]Repo = .__REPO_PLACEHOLDER__/ { sub(/__REPO_PLACEHOLDER__/, repo) }
            /^[$]PinnedVersion = .__VERSION_PLACEHOLDER__/ { sub(/__VERSION_PLACEHOLDER__/, version) }
            /^[$]EmbeddedChecksums = .__CHECKSUMS_PLACEHOLDER__/ { sub(/__CHECKSUMS_PLACEHOLDER__/, checksums) }
            { print }
          ' repo/install.ps1 > release/install.ps1
          echo "Generated version-pinned install.ps1 for $VERSION from $REPO"

      - name: Copy MDM login-start scripts
        run: |
          cp repo/mdm/linux/install-login-start.sh release/git-ai-login-start-linux.sh
          cp repo/mdm/windows/install-login-start.ps1 release/git-ai-login-start-windows.ps1
          chmod +x release/git-ai-login-start-*.sh

      - name: Add install scripts to SHA256SUMS
        run: |
          cd release
          sha256sum install.sh install.ps1 git-ai-login-start-* >> SHA256SUMS

      - name: Generate attestations for release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/git-ai-*
            release/install.sh
            release/install.ps1
            release/SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          tag_name: ${{ steps.release-meta.outputs.tag_name }}
          name: ${{ steps.release-meta.outputs.release_name }}
          generate_release_notes: true
          body: |
            ## git-ai ${{ steps.release-meta.outputs.tag_name }}

            ### Release Channel
            `${{ steps.release-meta.outputs.channel_label }}`

            > **Beta:** The Windows MSI installer is beta.

            ${{ steps.release-meta.outputs.prerelease != 'true' && '---' || '' }}

            ${{ steps.release-meta.outputs.prerelease != 'true' && '> **Detailed AI-generated changelog is being generated and will appear here shortly...**' || '' }}

            ${{ steps.release-meta.outputs.prerelease != 'true' && '---' || '' }}

            ### Installation
            Install this specific version with checksum verification:

            **Linux:**
            ```bash
            curl -fsSL https://github.com/${{ github.repository }}/releases/download/${{ steps.release-meta.outputs.tag_name }}/install.sh | bash
            ```

            **Windows (PowerShell):**
            ```powershell
            irm https://github.com/${{ github.repository }}/releases/download/${{ steps.release-meta.outputs.tag_name }}/install.ps1 | iex
            ```

            ### Downloads
            - **Linux (x64)**: `git-ai-linux-x64`
            - **Windows (x64)**: `git-ai-windows-x64.exe`
            - **Windows MSI (x64)**: `git-ai-windows-x64.msi`

            ### MDM login-start scripts
            Register `git-ai bg start` to run at login (see `mdm/README.md`):
            - **Linux systemd user unit**: `git-ai-login-start-linux.sh`
            - **Windows Scheduled Task**: `git-ai-login-start-windows.ps1`

            ### SHA256 Checksums
            ```
            $(cat release/SHA256SUMS)
            ```

            ### Attestation Verification
            Verify build provenance with the GitHub CLI:
            ```bash
            gh attestation verify git-ai-<platform> --repo ${{ github.repository }}
            ```
          files: |
            release/git-ai-*
            release/SHA256SUMS
            release/install.sh
            release/install.ps1
          draft: false
          prerelease: ${{ steps.release-meta.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.release-meta.outputs.make_latest }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
